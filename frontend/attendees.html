<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Attendees | Memoria</title>

    <link rel="stylesheet" href="css/attendees.css" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Poppins:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css"
    />
  </head>

  <body>
    <div class="container">
      <!-- Sidebar -->

      <div class="sidebar">
        <div class="logo">
          <img src="images/orilogo.png" alt="Memoria Logo" />
        </div>

        <ul>
          <li>
            <i class="fa-solid fa-house"></i>
            <a href="dashboard.html">Dashboard</a>
          </li>

          <li>
            <i class="fa-solid fa-calendar-days"></i>
            <a href="event.html">Events</a>
          </li>

          <li class="active">
            <i class="fa-solid fa-users"></i>
            <a href="attendees.html">Attendees</a>
          </li>

          
          <li>
            <i class="fa-solid fa-right-from-bracket"></i>
            <a href="#" id="logoutBtn">Logout</a>
          </li>
        </ul>
      </div>

      <!-- Main -->

      <div class="main">
        <header>
          <div>
            <p>Manage registered attendees</p>
            <h1>Attendees</h1>
          </div>
        </header>

        <!-- Top -->

        <div class="top-actions">
          <div class="search-box">
            <i class="fa-solid fa-magnifying-glass"></i>

            <input type="text" placeholder="Search attendees..." />
          </div>
        </div>

        <!-- Summary -->

        <div class="summary-row">
          <div>
            <h2>All Attendees</h2>

            <p>View and manage registered attendees.</p>
          </div>

          <div class="count-box">
            <strong>00</strong>

            <span>Total Attendees</span>
          </div>
        </div>

        <!-- Table -->

        <div class="table-card">
          <table>
            <thead>
              <tr>
                <th>Name</th>

                <th>Email</th>

                <th>Phone</th>

                <th>Event</th>

                <th>Ticket</th>

                <th>Action</th>
              </tr>
            </thead>

            <tbody id="attendeesTable">
              <!-- Loaded by JS -->
            </tbody>
          </table>
        </div>
      </div>
    </div>

    <script src="js/attendees.js"></script>
    <script src="js/logout.js"></script>
  </body>
</html>
