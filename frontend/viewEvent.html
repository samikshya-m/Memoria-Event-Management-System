<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>View Event | Memoria</title>

    <link rel="stylesheet" href="css/viewEvent.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

</head>

<body>

<header>

    <div class="logo">
        <img src="images/orilogo.png" alt="Memoria">
    </div>

    <nav>

        <a href="home.html">Home</a>

        <a href="events.html">Events</a>

        <a href="login.html">Login</a>

    </nav>

</header>

<section class="event-section">

    <div class="event-card">

        <div class="icon">
            <i class="fa-solid fa-calendar-days"></i>
        </div>

        <h1 id="eventName">Loading...</h1>

        <p id="description"></p>

        <div class="details">

            <p>
                <i class="fa-solid fa-calendar"></i>
                <span id="date"></span>
            </p>

            <p>
                <i class="fa-solid fa-clock"></i>
                <span id="time"></span>
            </p>

            <p>
                <i class="fa-solid fa-location-dot"></i>
                <span id="location"></span>
            </p>

            <p>
                <i class="fa-solid fa-users"></i>
                <span id="attendees"></span>
            </p>

        </div>

        <a id="registerBtn" class="register-btn">
            Register Now
        </a>

    </div>

</section>

<script src="js/viewEvent.js"></script>

</body>

</html>
