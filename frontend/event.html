<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Events | Memoria</title>
    <link rel="stylesheet" href="css/event.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Poppins:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css"
    />
  </head>
  <body>
    <div class="container">
      <div class="sidebar">
        <div class="logo">
          <img src="images/orilogo.png" alt="Memoria Logo" />
        </div>

        <ul>
          <li>
            <i class="fa-solid fa-house"></i
            ><a href="dashboard.html">Dashboard</a>
          </li>

          <li class="active">
            <i class="fa-solid fa-calendar-days"></i>
            <a href="event.html">Events</a>
          </li>

          <li>
            <i class="fa-solid fa-users"></i>
            <a href="attendees.html">Attendees</a>
          </li>

          <li>
            <i class="fa-solid fa-right-from-bracket"></i>
            <a href="#" id="logoutBtn">Logout</a>
          </li>
        </ul>
      </div>

      <div class="main">
        <header>
          <div>
            <p>Manage your events</p>
            <h1>Events</h1>
          </div>
        </header>

        <div class="top-actions">
          <div class="search-box">
            <i class="fa-solid fa-magnifying-glass"></i>
            <input type="text" placeholder="Search events by name..." />
          </div>

          <a href="addEvent.html" class="add-btn">
            <i class="fa-solid fa-plus"></i>
            Add New Event
          </a>
        </div>

        <div class="summary-row">
          <div>
            <h2>All Events</h2>
            <p>Manage and keep track of all your events.</p>
          </div>

          <div class="count-box">
            <strong>06</strong>
            <span>Total Events</span>
          </div>
        </div>

        <div class="table-card">
          <table>
            <thead>
              <tr>
                <th>EVENT NAME</th>
                <th>DATE</th>
                <th>TIME</th>
                <th>LOCATION</th>
                <th>ATTENDEES</th>
                <th>ACTIONS</th>
              </tr>
            </thead>

            <tbody id="eventsTable">
              <!-- Events loaded from JavaScript -->
            </tbody>
          </table>
        </div>
      </div>
    </div>
    <script src="js/event.js"></script>
    <script src="js/logout.js"></script>
  </body>
</html>
