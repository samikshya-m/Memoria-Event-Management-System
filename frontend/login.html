<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Poppins:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css"
    />

    <link rel="stylesheet" href="css/login.css" />

    <title>Login</title>
  </head>

  <body>
    <div class="container">
      <div id="left-sidebar">
        <img src="images/orilogo.png" alt="logo" />
      </div>
      <div id="right-sidebar">
        <h1>Welcome Back</h1>

        <p id="welcome-message">Login to your account to continue</p>

        <form>
          <label for="email">Email Address</label>

          <div class="input-box">
            <input
              type="email"
              id="email"
              placeholder="Enter your email"
              required
            />
          </div>

          <label for="password">Password</label>

          <div class="input-box">
            <input
              type="password"
              id="password"
              placeholder="Enter your password"
              required
            />
          </div>

          <div class="options">
            <label class="remember">
              <input type="checkbox" />

              Remember me
            </label>

            <a href="#">Forgot Password?</a>
          </div>

          <button type="submit" class="login-btn">
            <a href="dashboard.html">Login</a>
          </button>
        </form>

        <div class="divider">
          <span>or continue with</span>
        </div>

        <div class="social-buttons">
          <button class="social google">
            <i class="fa-brands fa-google"></i>Google
          </button>

          <button class="social facebook">
            <i class="fa-brands fa-facebook-f"></i>Facebook
          </button>
        </div>

        <p class="signup">
          Don't have an account?

          <a href="signup.html"> Sign Up </a>
        </p>
      </div>
    </div>
    <script src="js/login.js"></script>
  </body>
</html>
